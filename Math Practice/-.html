<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice</title>
</head>
<body style="background-color: black;">
    <div style="position: absolute; top: 50vh; left: 50vw; transform: translate(-50%, -50%);">
        <p id="number" style="color: white; font-weight: bold;"></p>
        <input type="text" id="input">
        <p id="time" style="color: white; font-weight: bold;"></p>
    </div>
    <script>
        let input = document.getElementById("input");
        let problem = document.getElementById("number")
        let timeResult = document.getElementById("time");
        let num1 = Math.round(Math.random() * 1000);
        let num2 = Math.round(Math.random() * 1000);
        let beforeTime = Date.now();
        problem.textContent = `${num1} - ${num2} = ?`;
        input.addEventListener("keydown", (event) => {
            console.log(event.key);
            if (event.key == "Enter"){
                if (Number(input.value) == num1 - num2){
                    timeResult.textContent = `It took${(Date.now() - beforeTime)/1000}sec`;
                    beforeTime = Date.now();
                    num1 = Math.round(Math.random() * 1000);
                    num2 = Math.round(Math.random() * 1000);
                    problem.textContent = `${num1} - ${num2} = ?`;
                    input.value = "";
                }else{
                    input.value = "";
                }
            }
        });
    </script>
</body>
</html>
